name: Cut Patch

# Entry point for a patch release. Trigger manually with the release/X.Y
# branch as input: bumps the patch version on that branch (skipped when the
# branch's current version is still untagged, e.g. after a previous
# half-completed run), then dispatches Create Release Tag, which tags the
# branch's declared version and fires Build Release. Everything after this
# dispatch is automatic.
on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to patch (e.g. release/3.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  cut-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          if [[ ! "${{ inputs.release_branch }}" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "error: release_branch must match release/X.Y (got '${{ inputs.release_branch }}')"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0
          # Deploy key: pushes authenticate over SSH and bypass the
          # release-branch ruleset (github-actions itself has no bypass).
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      # `just bump` re-locks both lockfiles, and pytix's is uv's — without
      # uv on PATH the bump dies at `uv sync` with exit 127.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Bump patch version
        run: |
          CURRENT=$(just _current)
          if ! git ls-remote --exit-code origin "refs/tags/v$CURRENT" >/dev/null; then
            echo "v$CURRENT is not tagged yet — releasing it as-is, no bump"
            exit 0
          fi
          just bump patch
          NEW=$(just _current)
          cargo update --workspace
          # Stage everything `just bump` touched, rather than naming files.
          # A hardcoded list keeps rotting as the bump grows: it dropped
          # tix-sdk once already (v3.0.3 shipped it still at 3.0.2), and it
          # now also misses pytix/uv.lock and the regenerated release data.
          # Nothing else runs between checkout and here, so -u stages
          # exactly the bump's own diff.
          git add -u
          just check-versions
          git commit -m "chore(release): bump patch v$CURRENT → v$NEW"
          git push origin ${{ inputs.release_branch }}

      - name: Dispatch Create Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run create-release-tag.yml --ref "${{ inputs.release_branch }}"
