name: Cut Release

# Entry point for a minor/major release. Trigger manually from main:
# creates a release/X.Y branch at the current HEAD, bumps main to the next
# minor (or major) version so development continues independently, then
# dispatches Create Release Tag on the new branch, which tags vX.Y.0 and
# fires Build Release. Everything after this dispatch is automatic.
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version component to bump on main after branching"
        required: true
        type: choice
        options: [minor, major]

permissions:
  contents: write
  actions: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Deploy key: pushes authenticate over SSH and bypass the
          # branch rulesets (github-actions itself has no bypass).
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      # `just bump` re-locks both lockfiles, and pytix's is uv's — without
      # uv on PATH the bump dies at `uv sync` with exit 127.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Create release branch from current HEAD
        run: |
          VERSION=$(just _current)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          BRANCH="release/${MAJOR}.${MINOR}"
          echo "RELEASE_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "CURRENT_VERSION=$VERSION" >> $GITHUB_ENV
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          git checkout main

      - name: Bump main to next development cycle
        run: |
          just bump ${{ inputs.bump_type }}
          NEW_VERSION=$(just _current)
          cargo update --workspace
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit and push main
        run: |
          # Stage everything `just bump` touched, rather than naming files.
          # A hardcoded list rots as the bump grows: it now re-locks both
          # lockfiles (pytix/uv.lock is uv's) and regenerates the install
          # page's release data, none of which the old list covered — a
          # stale release.json fails `just check-docs` on the next PR to
          # main. Nothing else runs between checkout and here, so -u stages
          # exactly the bump's own diff.
          git add -u
          just check-versions
          git commit -m "chore(release): cut ${{ env.RELEASE_BRANCH }}, advance main to v${{ env.NEW_VERSION }}"
          git push origin main

      - name: Dispatch Create Release Tag on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run create-release-tag.yml --ref "${{ env.RELEASE_BRANCH }}"
