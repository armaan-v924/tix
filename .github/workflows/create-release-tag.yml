name: Create Release Tag

# Tags a release/X.Y branch's declared version and pushes the tag, which
# fires Build Release and produces a GitHub release. Normally dispatched
# automatically by Cut Release and Cut Patch; manual dispatch from a
# release branch works too. Running from any other branch is a no-op
# (the job is skipped).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The commit about to be tagged has never been built as a release
  # artifact: cut-release and cut-patch push version bumps straight to a
  # branch, and pr-checks only runs on pull_request. Build the wheel and
  # the CLI archive and run both here, on every platform we ship, before
  # the tag exists.
  verify-artifacts:
    if: startsWith(github.ref, 'refs/heads/release/')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build wheel
        shell: bash
        run: just build-wheel "$(rustc -vV | awk '/^host/ { print $2 }')"
      - name: Smoke-test wheel
        shell: bash
        run: just smoke-wheel

      - name: Build release binary
        shell: bash
        run: just build-cli "$(rustc -vV | awk '/^host/ { print $2 }')"
      - name: Package binary
        shell: bash
        run: just package-cli "$(rustc -vV | awk '/^host/ { print $2 }')"
      - name: Smoke-test binary
        shell: bash
        run: just smoke-binary

  tag:
    runs-on: ubuntu-latest
    needs: verify-artifacts
    if: startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy key: tag pushes authenticate over SSH and bypass the
          # tag ruleset (github-actions itself has no bypass).
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          # Every branch and tag, for the release-notes preview below.
          fetch-depth: 0

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0,git-cliff@2.14.2
          fallback: none

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      # Last gate before the point of no return: the tag push fires
      # Build Release, which publishes. check-versions otherwise runs only
      # on pull requests, so nothing on the release path was verifying
      # lockstep.
      - name: Verify version lockstep
        run: just check-versions

      # Build Release renders these same notes after the tag exists. If
      # rendering failed there, the release would never be created. Running
      # it here first means a broken cliff.toml stops the release before the
      # tag is pushed. The preview goes to the run summary.
      - name: Preview release notes
        run: just release-notes >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and push
        run: just push-tag
