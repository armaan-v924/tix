name: Create Release Tag

# Tags a release/X.Y branch's declared version and pushes the tag, which
# fires Build Release and produces a GitHub release. Normally dispatched
# automatically by Cut Release and Cut Patch; manual dispatch from a
# release branch works too. Running from any other branch is a no-op
# (the job is skipped).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy key: tag pushes authenticate over SSH and bypass the
          # tag ruleset (github-actions itself has no bypass).
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Tag and push
        run: just push-tag
