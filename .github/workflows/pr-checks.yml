name: PR Checks

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: just lint-rust

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - run: just lint-python

  check-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - run: just check-license

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - run: just test-rust

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # `uv sync` compiles the pytix extension from source, so this job needs a
      # toolchain of its own rather than whatever the runner image happens to
      # ship.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - run: just test-python

  smoke-wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # The release workflow only runs on tag push, so without a PR leg the
      # smoke test would first execute during a release. Every platform the
      # release ships a wheel for is covered here: the loader checks that
      # reject a bad extension module are platform-specific, so a leg that
      # is missing is a platform whose wheel nobody has ever loaded.
      - name: Build wheel
        shell: bash
        run: just build-wheel "$(rustc -vV | awk '/^host/ { print $2 }')"
      - name: Smoke-test wheel
        shell: bash
        run: just smoke-wheel

  smoke-binary:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      # Same reasoning as smoke-wheel: without a PR leg, the binary and its
      # packaging would first be executed during a release. Each leg builds
      # for its host triple, so the archive is natively runnable on the
      # runner that made it, and packaging goes through the same recipe the
      # release uses — tar on Linux and macOS, zip on Windows.
      - name: Build release binary
        shell: bash
        run: just build-cli "$(rustc -vV | awk '/^host/ { print $2 }')"
      - name: Package binary
        shell: bash
        run: just package-cli "$(rustc -vV | awk '/^host/ { print $2 }')"
      - name: Smoke-test binary
        shell: bash
        run: just smoke-binary

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # Fails when the CLI reference or the man pages no longer match the
      # clap definition they are generated from.
      - run: just check-docs
      # And separately, that the site those pages feed still builds — a page
      # can be perfectly current and still break MDX.
      - run: just docs-deps docs-build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - run: just check-versions

  # Mirrors the justfile's `lint: lint-rust lint-python`.
  lint:
    if: always()
    needs: [lint-rust, lint-python]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "one or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  # Mirrors the justfile's `test: test-rust test-python`.
  test:
    if: always()
    needs: [test-rust, test-python]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "one or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  # Mirrors the justfile's `check: check-license check-versions check-docs`.
  check:
    if: always()
    needs: [check-license, check-versions, check-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "one or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  # Mirrors the justfile's `smoke: smoke-wheel smoke-binary`. A group of its
  # own since both are matrix jobs.
  smoke:
    if: always()
    needs: [smoke-wheel, smoke-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "one or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  # The single required status check for branch protection. Adding or
  # removing a check means editing the `needs` list of the relevant group
  # above (or adding a new group here), not going into the repo's branch
  # protection settings.
  required:
    if: always()
    needs: [lint, test, check, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "one or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
