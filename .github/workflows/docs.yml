name: Docs

# Publishes the release and development sites to the `docs` branch, which
# GitHub Pages serves at tix.armaanv.dev. The branch holds several independent
# site trees:
#
#   /            redirect to the newest release
#   /latest/     newest release      (published on a v* tag)
#   /vX.Y/       that release, pinned (published on a v* tag)
#   /dev/        main                 (published on every push to main)
#   /pr/<n>/     pull request preview (docs-preview.yml, removed on close)
#
# A release is *built twice* rather than copied: Astro bakes the base path
# into every URL it generates, so a copy of /v3.1/ would still link to
# /v3.1/. The build takes about a second, so this is cheaper than any
# rewriting scheme.
#
# The release workflow builds the same site, but only to attach a snapshot to
# the release — it never publishes. The preview workflows do write the branch,
# but only under /pr/, and every writer goes through
# .github/scripts/publish-docs.sh, which fast-forwards rather than
# force-pushes and redoes its update if another writer got there first.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled: cancelling a release publish half way
# through is worse than waiting for it. Previews deliberately stay out of this
# group. GitHub keeps one pending run per group and cancels it when another
# queues, so a preview queued behind a running /dev/ publish would silently
# drop a release publish waiting for its turn.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.59.0
          fallback: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Choose what to publish
        id: targets
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "targets=dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          # A patch release refreshes its minor's directory: /v3.1/ tracks
          # the newest 3.1.x, which is what pinning a version should mean.
          targets="v${version%.*}"

          # /latest/ follows the highest released version, not whichever tag
          # was pushed most recently. Patch releases are cut from release/X.Y
          # branches (see cut-patch.yml), so v3.0.5 can be tagged long after
          # 4.0 has shipped — and must not drag /latest/ back to the 3.0 line.
          git fetch --tags --force --quiet
          highest=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          if [[ "$GITHUB_REF_NAME" == "$highest" ]]; then
            targets="latest $targets"
          else
            echo "$GITHUB_REF_NAME is not the highest tag ($highest) — leaving /latest/ alone"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Build each tree
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          for target in ${{ steps.targets.outputs.targets }}; do
            DOCS_BASE="/$target/" just docs-deps docs-build
            mkdir -p "$stage/$target"
            cp -R docs/dist/. "$stage/$target/"
          done
          echo "STAGE=$stage" >> "$GITHUB_ENV"
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Publish to docs branch
        # Replaces only the trees this run built; every other tree on the
        # branch, previews included, is left exactly as it was. See the
        # script for how that is enforced and why the push is not forced.
        run: |
          set -euo pipefail
          args=()
          for target in $TARGETS; do
            args+=(--put "$target" "$STAGE/$target")
          done
          .github/scripts/publish-docs.sh \
            -m "Update $TARGETS for ${GITHUB_SHA:0:7}" "${args[@]}"
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
