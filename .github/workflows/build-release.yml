name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The single source of truth for what tix supports. The CLI binaries and the
  # pytix wheels must cover the same platforms — a plugin author who can run
  # `tix` must be able to `pip install pytix` on the same machine — and two
  # hand-maintained matrices drift. Both read this one.
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - id: list
        run: |
          cat >> "$GITHUB_OUTPUT" <<'OUTPUT'
          matrix<<JSON
          {"include": [
            {"os": "ubuntu-latest",  "target": "x86_64-unknown-linux-gnu", "suffix": "linux-x86_64.tar.gz",   "binary": "tix",     "format": "tar"},
            {"os": "macos-14",       "target": "aarch64-apple-darwin",     "suffix": "macos-aarch64.tar.gz",  "binary": "tix",     "format": "tar"},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc",   "suffix": "windows-x86_64.zip",    "binary": "tix.exe", "format": "zip"}
          ]}
          JSON
          OUTPUT

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Build docs
        run: just build-docs

      - name: Stage docs
        run: |
          DOC_OUT=$(mktemp -d)
          cp -r target/doc/* "$DOC_OUT"
          touch "$DOC_OUT/.nojekyll"
          # cargo doc emits only per-crate index pages; GitHub Pages 404s
          # without a root index.html.
          cat > "$DOC_OUT/index.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>tix API documentation</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
              h1 { font-size: 1.6rem; }
              li { margin: 0.5rem 0; }
            </style>
          </head>
          <body>
            <h1>tix API documentation</h1>
            <ul>
              <li><a href="tix_sdk/index.html"><code>tix-sdk</code></a> — the SDK for plugins and frontends</li>
              <li><a href="tix_engine/index.html"><code>tix-engine</code></a> — the core engine</li>
              <li><a href="tix/index.html"><code>tix</code></a> — the CLI</li>
            </ul>
          </body>
          </html>
          EOF
          echo "DOC_OUT=$DOC_OUT" >> $GITHUB_ENV

      - name: Publish docs to docs branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin docs || true
          if git show-ref --verify --quiet refs/heads/docs; then
            git checkout docs
          else
            git checkout --orphan docs
          fi
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          # `/.` instead of `/*`: the glob misses dotfiles, dropping .nojekyll
          cp -r "$DOC_OUT"/. .
          git add -A
          git commit -m "Update docs for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin docs --force

      - name: Package docs
        run: |
          mkdir -p dist
          tar -czf dist/docs-${GITHUB_REF_NAME}.tar.gz -C "$DOC_OUT" .

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: dist/docs-${{ github.ref_name }}.tar.gz

  build:
    needs: platforms
    strategy:
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build release binary
        shell: bash
        run: just build-cli ${{ matrix.target }}

      # Developer ID signing + notarization. Without it, Gatekeeper treats
      # the ad-hoc-signed binary as malware on quarantined (browser)
      # downloads. Skipped with a warning when the secrets are absent so a
      # missing cert degrades to an unsigned build instead of a red run.
      - name: Sign and notarize macOS binary
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12" ]]; then
            echo "::warning::APPLE_CERTIFICATE_P12 not set — shipping unsigned macOS binary"
            exit 0
          fi
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"

          # Import the Developer ID cert into a throwaway keychain.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"

          # Apple's Developer ID intermediate. Without it the chain cannot
          # be built and the identity is CSSMERR_TP_NOT_TRUSTED, so
          # find-identity returns nothing even with a valid cert + key.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" \
            -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          codesign --force --timestamp --options runtime --sign "$IDENTITY" "$BINARY"

          # Notarize: bare executables are submitted zipped. Stapling is
          # not possible for a bare binary (bundles/dmg/pkg only), so
          # Gatekeeper verifies the ticket online on first run.
          echo "$APPLE_NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k "$BINARY" "$RUNNER_TEMP/notarize.zip"
          SUBMIT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --output-format json)
          echo "$SUBMIT"
          STATUS=$(echo "$SUBMIT" | jq -r .status)
          if [[ "$STATUS" != "Accepted" ]]; then
            # --wait exits 0 even on rejection; surface Apple's log and fail.
            xcrun notarytool log "$(echo "$SUBMIT" | jq -r .id)" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" || true
            echo "::error::notarization status: $STATUS"
            exit 1
          fi

          security delete-keychain "$KEYCHAIN"
          codesign --verify --verbose=2 "$BINARY"

      - name: Package binary (tar)
        if: matrix.format == 'tar'
        run: |
          mkdir -p dist pkg
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} pkg/
          cp README.md LICENSE pkg/
          ARCHIVE="tix-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
          tar -czf dist/${ARCHIVE} -C pkg .
          echo "ARCHIVE_NAME=${ARCHIVE}" >> $GITHUB_ENV

      - name: Package binary (zip)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" pkg/
          Copy-Item README.md, LICENSE pkg/
          $archive = "tix-$env:GITHUB_REF_NAME-${{ matrix.suffix }}"
          Compress-Archive -Path pkg\* -DestinationPath "dist\$archive"
          "ARCHIVE_NAME=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/${{ env.ARCHIVE_NAME }}

  # Its own job rather than a leg of `build`: different tooling (maturin, not
  # cargo) and different per-leg steps. Folded into this workflow rather than a
  # second one, because `release` below is the only thing that may create the
  # release object — two `v*`-triggered workflows would race to create-or-update
  # it and regenerate its notes, leaving a window where the release exists with
  # half its assets.
  wheels:
    needs: platforms
    strategy:
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # abi3-py311 means one wheel per platform serves every Python >= 3.11,
      # so there is no Python version leg here — only a platform one.
      - name: Build wheel
        shell: bash
        run: just build-wheel ${{ matrix.target }}

      # Load-bearing: the wheel is otherwise uploaded without ever being
      # imported, so a wheel the platform loader rejects would ship green.
      - name: Smoke-test wheel
        shell: bash
        run: just smoke-wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [docs, build, wheels]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*.*
          overwrite_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
