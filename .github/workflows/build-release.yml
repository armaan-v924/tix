name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: extractions/setup-just@v2

      - name: Build docs
        run: just build-docs

      - name: Stage docs
        run: |
          DOC_OUT=$(mktemp -d)
          cp -r target/doc/* "$DOC_OUT"
          touch "$DOC_OUT/.nojekyll"
          echo "DOC_OUT=$DOC_OUT" >> $GITHUB_ENV

      - name: Publish docs to docs branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin docs || true
          if git show-ref --verify --quiet refs/heads/docs; then
            git checkout docs
          else
            git checkout --orphan docs
          fi
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -r "$DOC_OUT"/* .
          git add -A
          git commit -m "Update docs for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin docs --force

      - name: Package docs
        run: |
          mkdir -p dist
          tar -czf dist/docs-${GITHUB_REF_NAME}.tar.gz -C "$DOC_OUT" .

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: dist/docs-${{ github.ref_name }}.tar.gz

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64.tar.gz
            binary: tix
            format: tar
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64.tar.gz
            binary: tix
            format: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64.zip
            binary: tix.exe
            format: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: extractions/setup-just@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build release binary
        shell: bash
        run: just build-cli ${{ matrix.target }}

      - name: Package binary (tar)
        if: matrix.format == 'tar'
        run: |
          mkdir -p dist pkg
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} pkg/
          cp README.md LICENSE pkg/
          ARCHIVE="tix-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
          tar -czf dist/${ARCHIVE} -C pkg .
          echo "ARCHIVE_NAME=${ARCHIVE}" >> $GITHUB_ENV

      - name: Package binary (zip)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" pkg/
          Copy-Item README.md, LICENSE pkg/
          $archive = "tix-$env:GITHUB_REF_NAME-${{ matrix.suffix }}"
          Compress-Archive -Path pkg\* -DestinationPath "dist\$archive"
          "ARCHIVE_NAME=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/${{ env.ARCHIVE_NAME }}

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [docs, build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.*
          overwrite_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
