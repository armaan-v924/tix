[package]
name = "tix-cli"
version = "3.0.0"
edition = "2024"

[[bin]]
name = "tix"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["color", "derive"] }
tix-engine = { path = "../tix-engine" }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
