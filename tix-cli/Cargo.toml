[package]
name = "tix-cli"
version = "4.0.0"
edition = "2024"

[[bin]]
name = "tix"
path = "src/main.rs"
# The binary is a dispatch table over the library; documenting both
# publishes a near-empty `tix` crate beside the real `tix_cli` one.
doc = false

[dependencies]
clap = { version = "4.6.7", features = ["color", "derive"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
flate2 = "1.1.10"
semver = "1.0.28"
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
tix-sdk = { path = "../tix-sdk" }
toml = "1.2.0"
toml_edit = { version = "0.25.18", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.1", features = ["json"] }
url = { version = "2.5.8", features = ["serde"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[features]
# Enabled by xtask when generating the configuration reference.
schema = ["dep:schemars", "tix-sdk/schema"]

[dev-dependencies]
tempfile = "3.27.0"
