[package]
name = "tix-engine"
version = "3.0.4"
edition = "2024"

[dependencies]
# git2 0.21 ships `default = []` — a bare dependency compiles out HTTPS and
# SSH entirely, and any clone fails with "there is no TLS stream available".
# vendored-openssl statically links OpenSSL on Linux so the released binary
# does not depend on the build machine's libssl; it is inert on macOS and
# Windows, which use SecureTransport and WinHTTP.
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-openssl"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
# dev-only: round-trip tests and doctests of the serde section shapes.
# Document parsing is the SDK's job (design/spec.md §2.2).
toml = "1.1.2"
