[package]
name = "tix-engine"
version = "3.2.0"
edition = "2024"

[dependencies]
# git2 0.21 ships `default = []` — a bare dependency compiles out HTTPS and
# SSH entirely, and any clone fails with "there is no TLS stream available".
# vendored-libgit2 compiles libgit2 from the bundled source instead of
# probing pkg-config: without it, libgit2-sys silently links the *build
# machine's* libgit2 (plus its libssh2, llhttp, and libssl), so a release
# artifact is hermetic only as long as no runner image happens to have
# libgit2 installed. vendored-openssl statically links OpenSSL on Linux so
# the released binary does not depend on the build machine's libssl; it is
# inert on macOS and Windows, which use SecureTransport and WinHTTP.
git2 = { version = "0.21.0", features = [
    "https",
    "ssh",
    "vendored-libgit2",
    "vendored-openssl",
] }
# Optional and off by default: the derive it provides is what lets the
# documentation generator read this crate's config types instead of a
# hand-maintained copy of them. Released binaries never compile it.
schemars = { version = "1.2.2", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"

[features]
# Enabled by xtask when generating the configuration reference.
schema = ["dep:schemars"]

[dev-dependencies]
tempfile = "3.27.0"
# dev-only: round-trip tests and doctests of the serde section shapes.
# Document parsing is the SDK's job (design/spec.md §2.2).
toml = "1.1.2"
