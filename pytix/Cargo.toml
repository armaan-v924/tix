[package]
name = "pytix"
version = "3.2.0"
edition = "2024"

[lib]
name = "pytix"
crate-type = ["cdylib"]

[dependencies]
# Both crates are bound unconditionally — no Cargo feature gates, no pip
# extras. A wheel is built once and extras cannot vary compiled content, so
# `import pytix.host` must work in every wheel (design/spec.md §7).
tix-engine = { path = "../tix-engine" }
tix-sdk = { path = "../tix-sdk" }

# The two wire formats config travels in, needed directly because the bindings
# convert between them and Python values: TOML inbound, JSON out in a delta
# (design/spec.md §6). Kept at the SDK's versions so cargo unifies them to one
# crate instance — a second `toml_edit` would make the SDK's document types
# foreign to this crate.
serde_json = "1.0.151"
toml_edit = "0.25.13"

# abi3-py311: one wheel per platform covers every Python >= 3.11, which is
# also the release where `tomllib` entered the stdlib.
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }
