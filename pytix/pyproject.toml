[project]
name = "pytix"
version = "3.2.0"
requires-python = ">=3.11"
description = "Python bindings for tix: the engine, and the plugin SDK"
license = "MIT"
dependencies = []

[[project.authors]]
name = "Armaan Vakharia"
email = "git@mail.armaanv.dev"

[project.urls]
Home = "https://tix.armaanv.dev"

[build-system]
requires = ["maturin>=1.13.3,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "pytix"
features = ["pyo3/extension-module"]
python-source = "python"

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "pytest>=9.0.3",
]
