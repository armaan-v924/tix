[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pytix"
version = "3.0.1"
requires-python = ">=3.11"
description = "Python bindings for tix-engine"
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "pytest>=9.0.3",
]
