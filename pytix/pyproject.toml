[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pytix"
version = "3.1.0"
requires-python = ">=3.11"
description = "Python bindings for tix: the engine, and the plugin SDK"
dependencies = []

[tool.maturin]
# One extension module named `pytix`; the `pytix.host` namespace is a submodule
# registered from inside it, not a second artifact. The abi3-py311 feature lives
# on the pyo3 dependency in Cargo.toml, so every wheel here is
# `pytix-<version>-cp311-abi3-<platform>.whl` — one per platform, good for any
# Python >= 3.11.
module-name = "pytix"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "pytest>=9.0.3",
]
