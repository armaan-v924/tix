[package]
name = "tix-sdk"
version = "3.2.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tix-engine = { path = "../tix-engine" }
toml = "1.1.2"
toml_edit = { version = "0.25.13", features = ["serde"] }
tracing = "0.1.44"

[features]
# Passthrough so a frontend can reach the engine's schema derives without
# depending on tix-engine directly.
schema = ["tix-engine/schema"]

[dev-dependencies]
tempfile = "3.27.0"
